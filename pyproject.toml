[project]
name = "srl"
version = "0.1.0"
description = "Survival Reinforcement Learning (SRL) for goal-conditioned RL"
readme = "README.md"
requires-python = "==3.10.*"
dependencies = [
    "numpy==1.26.4",
    # Use environment markers for JAX to handle Linux/CUDA vs others automatically
    "jax[cuda12_pip]==0.4.23; platform_system == 'Linux'",
    "jax==0.4.23; platform_system != 'Linux'",
    "flax==0.7.4",
    "optax==0.2.2",
    "hydra-core==1.3.2",
    "hydra-submitit-launcher>=1.2.0",
    "wandb==0.30.0",
    "wandb-osh==1.2.2",
    "brax==0.10.1",
    "scipy==1.12.0",
    # Brax 0.10.1 requires the older MJX contact API (including mjx.ncon).
    "mujoco==3.1.3",
    "mujoco-mjx==3.1.3",
    "etils==1.13.0",
    "rich==14.2.0",
    "nvidia-cudnn-cu11>=8.9,<9.0; platform_system == 'Linux'",
    "nvidia-cuda-cupti-cu12>=12.4; platform_system == 'Linux'",
    "nvidia-cusolver-cu12>=11.7.3.90; platform_system == 'Linux'",
]

[tool.uv]
# Standard JAX release URL for CUDA wheels
find-links = ["https://storage.googleapis.com/jax-releases/jax_cuda_releases.html"]

[[tool.uv.index]]
name = "nvidia"
url = "https://pypi.nvidia.com"
# Setting explicit to false (default) allows uv to check here for the nvidia-* packages 
# if they aren't found on PyPI.

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

# Pixi does not use tool.uv's wheel-index settings.
[tool.pixi.pypi-options]
index-url = "https://pypi.org/simple"
find-links = [{ url = "https://storage.googleapis.com/jax-releases/jax_cuda_releases.html" }]

[tool.pixi.pypi-dependencies]
srl = { path = ".", editable = true }

[tool.pixi.tasks]

[tool.setuptools.packages.find]
include = ["srl*"]
namespaces = false
